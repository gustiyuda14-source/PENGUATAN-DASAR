<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>D AJIKS AKADEMI - PENGUATAN DASAR MATEMATIK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Luxury Dark Red & Black Color System */
            --bg-base:      #080810;
            --bg-surface:   #10101c;
            --bg-elevated:  #191926;
            --bg-card:      #13131f;

            --primary:      #dc1430;
            --primary-light:#ff2442;
            --primary-dark: #a50f22;
            --gold:         #c9a227;
            --success:      #22c55e;
            --error:        #ff3333;

            --text-primary: #f0ebe8;
            --text-secondary: #8a8a9a;
            --text-muted:   #55556a;

            --border:        rgba(220, 20, 48, 0.2);
            --border-bright: rgba(220, 20, 48, 0.5);
            
            --glow-red:      0 0 0 3px rgba(220, 20, 48, 0.28), 0 0 24px rgba(220, 20, 48, 0.14);
            
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-font-smoothing: antialiased; }

        body {
            height: 100dvh; width: 100%; overflow: hidden;
            background: var(--bg-base);
            background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(180, 10, 30, 0.15) 0%, transparent 60%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
        }

        .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }

        /* --- LAYAR 1: LOGIN --- */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; text-align: center; }
        .login-card {
            background: var(--bg-card); border: 1.5px solid var(--border); padding: 40px 30px;
            border-radius: var(--radius-xl); width: 100%; max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); position: relative;
        }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); }
        .login-card h1 { font-size: 28px; font-weight: 900; color: var(--text-primary); }
        .login-card h1 span { color: var(--primary); }
        .login-card h2 { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; font-weight: 500; }
        .login-input {
            width: 100%; padding: 16px; background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 12px; color: white; font-size: 16px; margin-bottom: 20px; outline: none; text-align: center;
        }
        .btn-luxury {
            width: 100%; padding: 16px; background: var(--primary); color: white; border: none;
            border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(220, 20, 48, 0.4); display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-luxury:active { transform: scale(0.96); background: var(--primary-dark); }
        .btn-secondary { background: var(--bg-elevated); border: 1.5px solid var(--border); box-shadow: none; }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

        /* --- LAYAR 2: QUIZ INTERFACE --- */
        #quiz-screen { display: none; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: var(--bg-base); position: relative; }
        .quiz-header { padding: 15px 20px; background: var(--bg-surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .poin-label { color: var(--primary); font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .user-name { font-size: 16px; font-weight: 700; }
        .timer-badge { font-family: 'JetBrains Mono', monospace; background: rgba(220, 20, 48, 0.1); color: var(--primary-light); padding: 6px 12px; border-radius: 8px; font-weight: 800; border: 1px solid var(--border); }
        .progress-indicator { padding: 10px; text-align: center; font-size: 12px; color: var(--text-secondary); font-weight: 700; background: var(--bg-surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        
        .question-container { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; min-height: 250px; }
        .math-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 30px; color: var(--text-primary); line-height: 1.4; }
        
        .answer-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 30px; width: 100%; }
        .ans-box {
            width: 80px; height: 80px; background: var(--bg-elevated); border: 2px solid var(--border); border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace;
            font-size: 28px; font-weight: 800; color: var(--text-primary); transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: var(--glow-red); }
            50%       { box-shadow: 0 0 0 4px rgba(220,20,48,0.4), 0 0 32px rgba(220,20,48,0.2); }
        }
        .ans-box.active { border-color: var(--primary-light); background: rgba(220, 20, 48, 0.08); animation: pulseGlow 2s ease-in-out infinite; transform: scale(1.05); }
        .frac-line { font-size: 32px; font-weight: 300; color: var(--primary); text-shadow: 0 0 12px rgba(220,20,48,0.5); }

        .luxury-numpad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 15px; background: #0c0c14; padding-bottom: max(15px, env(safe-area-inset-bottom)); flex-shrink: 0; border-top: 1px solid var(--border); }
        .num-btn {
            height: 52px; background: var(--bg-elevated); border: 1.5px solid rgba(255, 255, 255, 0.06); border-radius: 10px;
            color: white; font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.1s;
        }
        .num-btn:active { background: var(--bg-surface); transform: scale(0.92); border-color: var(--primary); }
        .num-btn.primary { background: var(--success); border: none; }
        .num-btn.del { background: rgba(220, 20, 48, 0.08); color: var(--primary); border-color: rgba(220, 20, 48, 0.25); }

        /* --- LAYAR 3: RESULTS & ACCORDION REVIEW --- */
        #result-screen { display: none; flex-direction: column; height: 100%; background: var(--bg-base); overflow-y: auto; }
        .result-hero { padding: 40px 20px; text-align: center; background: linear-gradient(to bottom, var(--bg-surface), transparent); border-bottom: 1px solid var(--border); }
        .result-hero h2 { color: var(--primary-light); font-weight: 900; font-size: 28px; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; }
        .stat-card { background: var(--bg-card); border: 1.5px solid var(--border); padding: 15px; border-radius: var(--radius-lg); text-align: center; box-shadow: 0 2px 20px rgba(0,0,0,0.8); }
        .stat-card .val { font-size: 24px; font-weight: 800; color: var(--success); font-family: 'JetBrains Mono'; }
        .stat-card .lab { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; margin-top: 5px; font-weight: 700; }

        .review-section { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
        .tab-bar { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-item { flex: 1; padding: 12px; text-align: center; border-radius: 8px; background: var(--bg-surface); font-size: 12px; font-weight: 700; cursor: pointer; border: 1.5px solid transparent; transition: all 0.2s; color: var(--text-secondary); }
        .tab-item.active { border-color: var(--primary); background: rgba(220, 20, 48, 0.1); color: var(--primary-light); }

        .filter-tabs { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .filter-btn { padding: 6px 15px; background: transparent; border: 1px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Accordion List */
        .accordion-item { background: var(--bg-elevated); border: 1.5px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden; }
        .acc-head {
            padding: 15px; background: var(--bg-card); display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            border-left: 4px solid transparent; transition: background 0.2s;
        }
        .acc-head:hover { background: var(--bg-surface); }
        .acc-head.correct { border-left-color: var(--success); }
        .acc-head.wrong { border-left-color: var(--error); }
        .acc-head-left { display: flex; align-items: center; gap: 15px; }
        .acc-head-left .num { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 14px; color: var(--text-muted); }
        .acc-head-left .soal { font-weight: 700; font-size: 14px; }
        .acc-chevron { font-size: 12px; transition: transform 0.3s; opacity: 0.6; }
        .acc-body { display: none; padding: 15px; background: var(--bg-elevated); border-top: 1px solid var(--border-bright); font-size: 13px; line-height: 1.6; }
        .acc-body.open { display: block; }
        .acc-head.open .acc-chevron { transform: rotate(180deg); }
        
        .chip { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-family: 'JetBrains Mono'; margin-top: 5px; }
        .chip.wrong { background: rgba(255, 51, 51, 0.15); color: #f87171; }
        .chip.right { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .chip.key { background: rgba(255, 255, 255, 0.08); color: var(--text-secondary); margin-left: 8px; }
        .bahas-text { color: var(--text-secondary); margin-top: 10px; font-style: italic; border-left: 2px solid var(--gold); padding-left: 10px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1>D AJIKS <span>AKADEMI</span></h1>
            <h2>Penguatan Dasar Matematik</h2>
            <input type="text" id="input-nama" class="login-input" placeholder="Masukkan Nama Lengkap" autocomplete="off">
            <button class="btn-luxury" onclick="startTest()">MULAI LATIHAN</button>
        </div>
    </div>

    <div id="quiz-screen">
        <div class="quiz-header">
            <div class="user-info">
                <div class="poin-label" id="lbl-poin">POIN 1/3</div>
                <div class="user-name" id="lbl-nama">Nama</div>
            </div>
            <div class="timer-badge" id="lbl-timer">00:00</div>
        </div>
        
        <div class="progress-indicator" id="lbl-progress">SOAL 1 DARI 50</div>
        
        <div class="question-container">
            <div class="math-text" id="soal-text">Memuat soal...</div>
            
            <div class="answer-wrapper" id="input-container">
                </div>
            
            <div style="display:flex; gap:10px; width:100%; max-width:300px; margin-top:10px;">
                <button class="btn-luxury btn-secondary" style="padding:12px; font-size:14px;" id="btn-prev" onclick="changeQuestion(-1)">PREV</button>
                <button class="btn-luxury btn-secondary" style="padding:12px; font-size:14px;" id="btn-next" onclick="changeQuestion(1)">NEXT</button>
            </div>
            <button class="btn-luxury" style="background:var(--success); margin-top:10px; display:none; max-width:300px;" id="btn-submit" onclick="submitPoin()">SUBMIT POIN 1</button>
        </div>

        <div class="luxury-numpad">
            <button class="num-btn" onclick="inputNum('7')">7</button>
            <button class="num-btn" onclick="inputNum('8')">8</button>
            <button class="num-btn" onclick="inputNum('9')">9</button>
            <button class="num-btn del" onclick="deleteNum()">⌫</button>
            
            <button class="num-btn" onclick="inputNum('4')">4</button>
            <button class="num-btn" onclick="inputNum('5')">5</button>
            <button class="num-btn" onclick="inputNum('6')">6</button>
            <button class="num-btn" style="color:var(--gold)" onclick="clearNum()">C</button>
            
            <button class="num-btn" onclick="inputNum('1')">1</button>
            <button class="num-btn" onclick="inputNum('2')">2</button>
            <button class="num-btn" onclick="inputNum('3')">3</button>
            <button class="num-btn primary" onclick="nextAction()" style="grid-row: span 2; height: auto;">OK</button>
            
            <button class="num-btn" onclick="inputNum('0')" style="grid-column: 1 / span 3;">0</button>
        </div>
    </div>

    <div id="result-screen">
        <div class="result-hero">
            <h2>HASIL LATIHAN</h2>
            <p id="res-nama" style="color:var(--text-secondary); margin-top:10px; font-weight:700;">Nama Murid</p>
            <div class="mono" style="color:var(--gold); margin-top:5px; font-size:18px;">
                Total Waktu: <span id="res-waktu" style="font-weight:bold;">00:00</span> | Skor: <span id="res-total" style="color:var(--success); font-weight:bold;">0/150</span>
            </div>
        </div>
        
        <div class="stat-grid">
            <div class="stat-card"><div class="val" id="score-p1">0/50</div><div class="lab">Poin 1</div></div>
            <div class="stat-card"><div class="val" id="score-p2">0/50</div><div class="lab">Poin 2</div></div>
            <div class="stat-card"><div class="val" id="score-p3">0/50</div><div class="lab">Poin 3</div></div>
        </div>

        <div class="review-section">
            <div class="tab-bar">
                <div class="tab-item active" onclick="switchTab(1)">POIN 1</div>
                <div class="tab-item" onclick="switchTab(2)">POIN 2</div>
                <div class="tab-item" onclick="switchTab(3)">POIN 3</div>
            </div>

            <div class="filter-tabs">
                <button class="filter-btn active" onclick="setFilter('semua')">Semua</button>
                <button class="filter-btn" onclick="setFilter('benar')">Benar Saja</button>
                <button class="filter-btn" onclick="setFilter('salah')">Salah Saja</button>
            </div>

            <div id="accordion-container">
                </div>
        </div>
    </div>

<script>
    // --- DATABASE & GENERATOR SOAL (EXPERT LEVEL) ---
    const allQuestions = { 1: [], 2: [], 3: [] };

    function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

    function generateQuestions() {
        // Poin 1: Digit Cycle
        for(let i=1; i<=50; i++) {
            if(i <= 25) {
                let base = rand(3, 9); let multiplier = rand(11, 49); let target = base * multiplier;
                let mirrorBase = base === 3 ? 7 : (base === 7 ? 3 : (base === 2 ? 8 : 9));
                let ans = mirrorBase * multiplier;
                allQuestions[1].push({ text: `Jika ${base} × n = ${target},<br>maka ${mirrorBase} × n = ?`, ans: ans.toString(), bahas: `n = ${target}/${base} = ${multiplier}. Maka ${mirrorBase} × ${multiplier} = ${ans}` });
            } else {
                let p1 = rand(30, 99); let p2 = rand(30, 99); let b1 = rand(2, 9); let b2 = rand(2, 9);
                let cycle1 = [b1%10, (b1**2)%10, (b1**3)%10, (b1**4)%10];
                let cycle2 = [b2%10, (b2**2)%10, (b2**3)%10, (b2**4)%10];
                let s1 = cycle1[(p1-1)%4]; let s2 = cycle2[(p2-1)%4]; let ans = (s1 + s2) % 10;
                allQuestions[1].push({ text: `Satuan dari:<br>${b1}<sup>${p1}</sup> + ${b2}<sup>${p2}</sup>`, ans: ans.toString(), bahas: `Satuan ${b1}^${p1} adalah ${s1}. Satuan ${b2}^${p2} adalah ${s2}. Total = ${s1}+${s2} = ${ans}.` });
            }
        }

        // Poin 2: Decompose
        for(let i=1; i<=50; i++) {
            let n1, n2;
            if(i <= 10) { n1 = rand(7,9); n2 = rand(80, 99); }
            else if(i <= 25) { n1 = rand(11, 19); n2 = rand(21, 49); }
            else { n1 = rand(37, 99); n2 = rand(41, 99); }
            let ans = n1 * n2;
            let n2_round = Math.ceil(n2/10)*10; let diff = n2_round - n2;
            let bahas = diff <= 3 ? `${n1} × (${n2_round} - ${diff}) = ${n1*n2_round} - ${n1*diff} = ${ans}` : `${n1} × (${n2 - (n2%10)} + ${n2%10}) = ${ans}`;
            allQuestions[2].push({ text: `${n1} × ${n2} = ?`, ans: ans.toString(), bahas: `Dekomposisi: ` + bahas });
        }

        // Poin 3: Fraction Shape
        for(let i=1; i<=50; i++) {
            let mult = i <= 20 ? rand(4, 12) : rand(15, 45);
            let p, q; do { p = rand(1, 9); q = rand(p+1, 15); } while (gcd(p, q) !== 1);
            let num = p * mult; let den = q * mult;
            allQuestions[3].push({ text: `Sederhanakan:<br>${num} / ${den}`, ans: { p: p.toString(), q: q.toString() }, bahas: `Bongkar penyebut: ${den} = ${q} × ${mult}. Pembilang: ${num} / ${mult} = ${p}.` });
        }
    }

    // --- STATE MANAGEMENT ---
    const state = {
        nama: '', currentPoin: 1, currentQ: 0,
        answers: { 1: Array(50).fill(null), 2: Array(50).fill(null), 3: Array(50).fill(null) },
        submitted: { 1: false, 2: false, 3: false },
        elapsed: 0, timerInterval: null, activeInput: 0
    };

    let resView = { tab: 1, filter: 'semua' };

    // --- LOGIC FUNCTIONS ---
    function startTest() {
        const inputNama = document.getElementById('input-nama').value.trim();
        if(!inputNama) { alert("Silakan masukkan nama Anda!"); return; }
        state.nama = inputNama;
        document.getElementById('lbl-nama').textContent = state.nama;
        generateQuestions();
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'flex';
        
        state.timerInterval = setInterval(() => {
            state.elapsed++;
            const mm = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
            const ss = String(state.elapsed % 60).padStart(2, '0');
            document.getElementById('lbl-timer').textContent = `${mm}:${ss}`;
        }, 1000);

        renderQuestion();
    }

    function renderQuestion() {
        const p = state.currentPoin; const qIdx = state.currentQ; const qData = allQuestions[p][qIdx];
        document.getElementById('lbl-poin').textContent = `POIN ${p}/3`;
        document.getElementById('lbl-progress').textContent = `SOAL ${qIdx + 1} DARI 50`;
        document.getElementById('soal-text').innerHTML = qData.text;

        const inputContainer = document.getElementById('input-container');
        inputContainer.innerHTML = '';

        if(p < 3) {
            state.activeInput = 0; let val = state.answers[p][qIdx] || '';
            inputContainer.innerHTML = `<div class="ans-box active" id="in-0">${val}</div>`;
        } else {
            state.activeInput = 0;
            let valP = state.answers[p][qIdx] ? state.answers[p][qIdx].p : '';
            let valQ = state.answers[p][qIdx] ? state.answers[p][qIdx].q : '';
            inputContainer.innerHTML = `
                <div class="ans-box active" id="in-0" onclick="setActiveInput(0)">${valP}</div>
                <div class="frac-line">/</div>
                <div class="ans-box" id="in-1" onclick="setActiveInput(1)">${valQ}</div>
            `;
        }

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next'); 
        const btnSubmit = document.getElementById('btn-submit');
        
        btnPrev.disabled = qIdx === 0;
        
        if(qIdx === 49) { 
            btnNext.style.display = 'none'; 
            btnSubmit.style.display = 'block'; 
            btnSubmit.textContent = p === 3 ? "SUBMIT SEMUA POIN" : `SUBMIT POIN ${p}`; 
        } else { 
            btnNext.style.display = 'block'; 
            btnSubmit.style.display = 'none'; 
        }
    }

    function setActiveInput(idx) {
        state.activeInput = idx;
        document.getElementById('in-0').classList.remove('active'); document.getElementById('in-1').classList.remove('active');
        document.getElementById(`in-${idx}`).classList.add('active');
    }

    function changeQuestion(step) { let newQ = state.currentQ + step; if(newQ >= 0 && newQ < 50) { state.currentQ = newQ; renderQuestion(); } }
    function nextAction() { if(state.currentPoin === 3 && state.activeInput === 0) setActiveInput(1); else if(state.currentQ < 49) changeQuestion(1); }

    // --- NUMPAD LOGIC ---
    function updateAnswerState(val) {
        const p = state.currentPoin; const qIdx = state.currentQ;
        if(p < 3) state.answers[p][qIdx] = val;
        else {
            if(!state.answers[p][qIdx]) state.answers[p][qIdx] = {p:'', q:''};
            if(state.activeInput === 0) state.answers[p][qIdx].p = val; else state.answers[p][qIdx].q = val;
        }
    }
    function inputNum(num) { const el = document.getElementById(`in-${state.activeInput}`); el.textContent += num; updateAnswerState(el.textContent); }
    function deleteNum() { const el = document.getElementById(`in-${state.activeInput}`); el.textContent = el.textContent.slice(0, -1); updateAnswerState(el.textContent); }
    function clearNum() { const el = document.getElementById(`in-${state.activeInput}`); el.textContent = ''; updateAnswerState(''); }

    // --- SUBMIT LOGIC ---
    function submitPoin() {
        if(confirm(`Yakin submit Poin ${state.currentPoin}? Jawaban akan dikunci.`)) {
            state.submitted[state.currentPoin] = true;
            if(state.currentPoin < 3) { state.currentPoin++; state.currentQ = 0; renderQuestion(); }
            else finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(state.timerInterval);
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'flex';
        
        const mm = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
        const ss = String(state.elapsed % 60).padStart(2, '0');
        document.getElementById('res-nama').textContent = state.nama;
        document.getElementById('res-waktu').textContent = `${mm}:${ss}`;

        let totalCorrect = 0; let scores = {1:0, 2:0, 3:0};
        for(let p=1; p<=3; p++) {
            for(let i=0; i<50; i++) {
                let uAns = state.answers[p][i]; let rAns = allQuestions[p][i].ans; let isBenar = false;
                if(p < 3) { if(uAns === rAns) isBenar = true; }
                else { if(uAns && uAns.p === rAns.p && uAns.q === rAns.q) isBenar = true; }
                if(isBenar) { scores[p]++; totalCorrect++; }
            }
            document.getElementById(`score-p${p}`).textContent = `${scores[p]}/50`;
        }
        document.getElementById('res-total').textContent = `${totalCorrect}/150`;
        renderReview();
    }

    // --- RESULT & ACCORDION REVIEW UI ---
    function switchTab(p) {
        resView.tab = p;
        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach((t, idx) => { if(idx+1 === p) t.classList.add('active'); else t.classList.remove('active'); });
        renderReview();
    }

    function setFilter(f) {
        resView.filter = f;
        const btns = document.querySelectorAll('.filter-btn');
        btns[0].classList.toggle('active', f==='semua'); btns[1].classList.toggle('active', f==='benar'); btns[2].classList.toggle('active', f==='salah');
        renderReview();
    }

    function toggleAccordion(element) {
        element.classList.toggle('open');
        const body = element.nextElementSibling;
        body.classList.toggle('open');
    }

    function renderReview() {
        const container = document.getElementById('accordion-container');
        container.innerHTML = '';
        const p = resView.tab;
        
        for(let i=0; i<50; i++) {
            let q = allQuestions[p][i]; let userAns = state.answers[p][i]; let realAns = q.ans;
            let uText = "-", rText = "-"; let isBenar = false;

            if(p < 3) {
                uText = userAns || "-"; rText = realAns; isBenar = (uText === rText);
            } else {
                uText = (userAns && userAns.p) ? `${userAns.p}/${userAns.q}` : "-";
                rText = `${realAns.p}/${realAns.q}`;
                isBenar = (userAns && userAns.p === realAns.p && userAns.q === realAns.q);
            }

            if(resView.filter === 'benar' && !isBenar) continue;
            if(resView.filter === 'salah' && isBenar) continue;

            let stripQText = q.text.replace(/<br>/g, ' ');
            let userChip = isBenar ? `<span class="chip right">✓ ${uText}</span>` : `<span class="chip wrong">✗ ${uText}</span>`;
            let keyChip = isBenar ? '' : `<span class="chip key">Kunci: ${rText}</span>`;

            let acc = document.createElement('div');
            acc.className = 'accordion-item';
            acc.innerHTML = `
                <div class="acc-head ${isBenar ? 'correct' : 'wrong'}" onclick="toggleAccordion(this)">
                    <div class="acc-head-left">
                        <span class="num">#${String(i+1).padStart(2,'0')}</span>
                        <span class="soal">${stripQText}</span>
                    </div>
                    <div class="acc-chevron">▼</div>
                </div>
                <div class="acc-body">
                    <div style="margin-bottom:10px;">${userChip} ${keyChip}</div>
                    <div class="bahas-text">${q.bahas}</div>
                </div>
            `;
            container.appendChild(acc);
        }

        if(container.innerHTML === '') {
            container.innerHTML = `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:14px;">Tidak ada data untuk filter ini.</div>`;
        }
    }
</script>
</body>
</html>
